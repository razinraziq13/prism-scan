<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Install Tutorial</title>
<meta name="theme-color" content="#7c3aed">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #140c29; --text: #f6f2ff; --muted: #b9addb; --grad: linear-gradient(135deg, #7c3aed, #ec4899 55%, #f97316); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 20% 0%, #3b1a7a 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  h1 { margin: 6px 0 4px; font-size: 22px; text-align: center; }
  p.sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; text-align: center; }
  .os { display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.1); margin-bottom: 14px; }
  .os button {
    border: 0; border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 700; font-size: 14px;
    color: var(--muted); background: transparent; cursor: pointer;
  }
  .os button.on { background: var(--grad); color: #fff; }
  .player { width: 100%; max-width: 420px; }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; max-height: 70vh; object-fit: contain;
    border-radius: 22px; box-shadow: 0 20px 60px -15px rgba(236,72,153,.55); background: #000; cursor: pointer;
  }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .controls button {
    width: 46px; height: 46px; border-radius: 14px; border: 0; color: #fff; font-size: 18px; cursor: pointer;
    background: var(--grad); flex-shrink: 0;
  }
  .controls button.alt { background: rgba(255,255,255,.12); }
  input[type=range] { flex: 1; min-width: 0; accent-color: #ec4899; }
  .time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); width: 74px; text-align: right; }
  .links { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; width: 100%; max-width: 420px; }
  .links a { display: block; text-align: center; padding: 14px; border-radius: 16px; font-weight: 700; text-decoration: none; color: #fff; }
  .links a.primary { background: var(--grad); }
  .links a.ghost { background: rgba(255,255,255,.1); }
</style>
</head>
<body>
  <h1>How to install Prism Scan</h1>
  <p class="sub" id="subline">A short guide</p>
  <div class="os" role="tablist">
    <button id="os-ios" role="tab"> iPhone</button>
    <button id="os-android" role="tab">🤖 Android</button>
  </div>
  <div class="player">
    <canvas id="v" width="1080" height="1920" aria-label="Animated install tutorial"></canvas>
    <div class="controls">
      <button id="play" aria-label="Play">▶</button>
      <button id="restart" class="alt" aria-label="Restart">↺</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
  </div>
  <div class="links">
    <a class="primary" id="dl" href="tutorial.mp4" download>⬇ Download video (MP4)</a>
    <a class="ghost" href="./">Open Prism Scan →</a>
  </div>

<script>
'use strict';
const W = 1080, H = 1920;
const cv = document.getElementById('v'), ctx = cv.getContext('2d');
const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif';
const EMOJI = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const LINK = 'razinraziq13.github.io/prism-scan';
const icon = new Image(); icon.src = 'icons/icon-512.png';
const iconRound = new Image(); iconRound.src = 'icons/icon-maskable-512.png';
let OS = new URLSearchParams(location.search).get('os') || (/android/i.test(navigator.userAgent) ? 'android' : 'ios');
if (OS !== 'android') OS = 'ios';

/* phone geometry: screen content is drawn in phone points (393 x 866) */
const PX = 250, PY = 560, PW = 580, PH = 1240, BZ = 16;
const SX = PX + BZ, SY = PY + BZ, SW = PW - BZ * 2, SH = PH - BZ * 2;
const U = SW / 393, SHP = SH / U;

/* ---------- helpers ---------- */
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, color, weight = 700, align = 'left', font = FONT) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function emoji(e, x, y, size) { txt(e, x, y, size, '#000', 400, 'center', EMOJI); }
function grad(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
const BRAND = ['#7c3aed', '#ec4899', '#f97316'];
const pulse = t => .5 + .5 * Math.sin(t * 9);

function finger(t, t0, x, y) {
  if (t < t0 - .75 || t > t0 + .55) return;
  const a = easeOut(seg(t, t0 - .75, t0 - .35)) * (1 - seg(t, t0 + .3, t0 + .55));
  const k = easeOut(seg(t, t0 - .75, t0 - .1)), fx = lerp(x + 46, x, k), fy = lerp(y + 70, y, k);
  const pressed = Math.abs(t - t0) < .13;
  ctx.save(); ctx.globalAlpha = a;
  if (t >= t0) {
    const p = seg(t, t0, t0 + .45);
    ctx.beginPath(); ctx.arc(x, y, 20 + p * 34, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${1 - p})`; ctx.lineWidth = 4; ctx.stroke();
  }
  fingerDot(fx, fy, pressed);
  ctx.restore();
}
function fingerDot(x, y, pressed) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x, y, pressed ? 17 : 21, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
}
function statusBar(color) {
  if (OS === 'android') {
    txt('9:41', 30, 24, 14, color, 600);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(318, 30); ctx.lineTo(334, 30); ctx.lineTo(334, 16); ctx.closePath(); ctx.fill();
    rr(346, 16, 9, 15, 2); ctx.fill();
    return;
  }
  txt('9:41', 52, 27, 16, color, 600, 'center');
  ctx.fillStyle = color;
  for (let i = 0; i < 4; i++) rr(300 + i * 6, 31 - i * 3, 4, 5 + i * 3, 1), ctx.fill();
  rr(334, 21, 26, 13, 4); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  rr(336.5, 23.5, 19, 8, 2); ctx.fill();
}
function drawIcon(x, y, s, round) {
  const img = round ? iconRound : icon;
  if (!img.complete) return;
  ctx.save();
  if (round) { ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s / 2, 0, Math.PI * 2); } else rr(x, y, s, s, s * .23);
  ctx.clip(); ctx.drawImage(img, x, y, s, s); ctx.restore();
}

/* ---------- background & frame ---------- */
function background(T) {
  ctx.fillStyle = grad(0, 0, W, H, OS === 'android' ? ['#4c1d95', '#be185d', '#0d9488'] : ['#5b21b6', '#be185d', '#ea580c']);
  ctx.fillRect(0, 0, W, H);
  const blobs = [['#fde047', 820, 260, 320], ['#22d3ee', 160, 1500, 360], ['#a3e635', 900, 1350, 220], ['#f0abfc', 200, 380, 260]];
  blobs.forEach(([c, x, y, r], i) => {
    const bx = x + Math.sin(T * .5 + i * 1.7) * 60, by = y + Math.cos(T * .4 + i) * 50;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
    g.addColorStop(0, c + '66'); g.addColorStop(1, c + '00');
    ctx.fillStyle = g; ctx.fillRect(bx - r, by - r, r * 2, r * 2);
  });
}
function phone(draw) {
  const R = OS === 'android' ? 70 : 92;
  ctx.save();
  ctx.shadowColor = 'rgba(30,0,60,.55)'; ctx.shadowBlur = 90; ctx.shadowOffsetY = 36;
  rr(PX, PY, PW, PH, R); ctx.fillStyle = '#0b0a12'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 7; ctx.strokeStyle = OS === 'android' ? '#3f4a5a' : '#4b4566'; ctx.stroke();
  ctx.save(); rr(SX, SY, SW, SH, R - 14); ctx.clip();
  ctx.translate(SX, SY); ctx.scale(U, U); draw();
  ctx.restore();
  if (OS === 'android') { ctx.beginPath(); ctx.arc(PX + PW / 2, SY + 36, 15, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill(); }
  else { rr(PX + PW / 2 - 72, SY + 22, 144, 42, 21); ctx.fillStyle = '#000'; ctx.fill(); }
  ctx.restore();
}
function caption(t, sc) {
  const a = easeOut(seg(t, 0, .5)), dy = (1 - a) * 40;
  ctx.save(); ctx.globalAlpha = a;
  const label = `STEP ${sc.step} OF ${STEPS}`;
  ctx.font = `800 34px ${FONT}`; const w = ctx.measureText(label).width + 56;
  rr(W / 2 - w / 2, 120 + dy, w, 62, 31); ctx.fillStyle = '#fff'; ctx.fill();
  txt(label, W / 2, 152 + dy, 34, '#7c3aed', 800, 'center');
  ctx.shadowColor = 'rgba(40,0,70,.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  txt(sc.title, W / 2, 275 + dy, 84, '#fff', 800, 'center');
  ctx.shadowBlur = 10;
  txt(sc.sub, W / 2, 380 + dy, 44, 'rgba(255,255,255,.92)', 600, 'center');
  ctx.restore();
}

/* ---------- home screens ---------- */
const GRID_APPS = [
  ['Camera', '📷', ['#6b7280', '#1f2937']], ['Photos', '🌸', ['#fff', '#f1f5f9']], ['Mail', '✉️', ['#60a5fa', '#2563eb']], ['Calendar', '📅', ['#fff', '#f1f5f9']],
  ['Weather', '⛅', ['#38bdf8', '#1d4ed8']], ['Maps', '🗺️', ['#86efac', '#16a34a']], ['Notes', '📝', ['#fef08a', '#facc15']], ['Settings', '⚙️', ['#9ca3af', '#4b5563']],
  ['Clock', '⏰', ['#1f2937', '#000']], ['Files', '📁', ['#93c5fd', '#3b82f6']], ['Calculator', '🧮', ['#f59e0b', '#c2410c']], ['Health', '❤️', ['#fff', '#fce7f3']],
];
const DOCK_IOS = [['📞', ['#4ade80', '#16a34a']], ['🧭', ['#7dd3fc', '#2563eb']], ['💬', ['#4ade80', '#15803d']], ['🎵', ['#fb7185', '#e11d48']]];
const DOCK_ANDROID = [['📞', ['#4ade80', '#16a34a']], ['💬', ['#60a5fa', '#2563eb']], ['🌐', ['#fff', '#e2e8f0']], ['📷', ['#6b7280', '#1f2937']]];
const BROWSER_DOCK = () => OS === 'android' ? 2 : 1;
const gridPos = i => [26 + (i % 4) * 92, 74 + Math.floor(i / 4) * 106];
const dockX = i => 12 + 369 * (i + .5) / 4;
const dockY = () => OS === 'android' ? SHP - 170 : SHP - 97;
function appIcon(x, y, e, cols, s = 62) {
  if (OS === 'android') { ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s / 2, 0, Math.PI * 2); } else rr(x, y, s, s, s * .23);
  ctx.fillStyle = grad(x, y, x, y + s, cols); ctx.fill();
  emoji(e, x + s / 2, y + s / 2 + 2, s * .5);
}
function homeScreen(t, o = {}) {
  ctx.fillStyle = grad(0, 0, 393, SHP, OS === 'android' ? ['#134e4a', '#4338ca', '#9d174d'] : ['#312e81', '#7c3aed', '#db2777']);
  ctx.fillRect(0, 0, 393, SHP);
  const g = ctx.createRadialGradient(300, 200, 0, 300, 200, 300); g.addColorStop(0, 'rgba(251,191,36,.35)'); g.addColorStop(1, 'rgba(251,191,36,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 393, SHP);
  statusBar('#fff');
  GRID_APPS.forEach(([n, e, c], i) => { const [x, y] = gridPos(i); appIcon(x, y, e, c); txt(n, x + 31, y + 76, 11.5, '#fff', 500, 'center'); });
  if (o.prism > 0) {
    const [x, y] = gridPos(12), s = backOut(o.prism);
    ctx.save(); ctx.translate(x + 31, y + 31); ctx.scale(s, s); drawIcon(-31, -31, 62, OS === 'android'); ctx.restore();
    ctx.globalAlpha = clamp01(o.prism * 2); txt('Prism Scan', x + 31, y + 76, 11.5, '#fff', 600, 'center'); ctx.globalAlpha = 1;
    if (o.sparkle > 0 && o.sparkle < 1) {
      for (let k = 0; k < 8; k++) {
        const ang = k / 8 * Math.PI * 2, d = 40 + o.sparkle * 45;
        ctx.globalAlpha = 1 - o.sparkle; emoji(k % 2 ? '✨' : '⭐', x + 31 + Math.cos(ang) * d, y + 31 + Math.sin(ang) * d, 16);
      }
      ctx.globalAlpha = 1;
    }
  }
  const dock = OS === 'android' ? DOCK_ANDROID : DOCK_IOS, dy = dockY();
  if (OS === 'android') {
    rr(20, SHP - 78, 353, 52, 26); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    txt('🔍  Search', 44, SHP - 52, 16, '#555', 500, 'left', `${FONT}, ${EMOJI}`);
  } else { rr(12, SHP - 112, 369, 92, 30); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill(); }
  dock.forEach(([e, c], i) => {
    const x = dockX(i) - 31;
    appIcon(x, dy, e, c);
    if (o.glow === i) {
      if (OS === 'android') { ctx.beginPath(); ctx.arc(x + 31, dy + 31, 36, 0, 7); } else rr(x - 4, dy - 4, 70, 70, 18);
      ctx.strokeStyle = '#fde047'; ctx.lineWidth = 4; ctx.stroke();
    }
  });
  if (o.toast > 0) {
    ctx.globalAlpha = o.toast; rr(76, SHP - 150, 241, 40, 20); ctx.fillStyle = 'rgba(30,30,30,.9)'; ctx.fill();
    txt('Prism Scan installed', 196, SHP - 130, 14, '#fff', 600, 'center'); ctx.globalAlpha = 1;
  }
}

/* ---------- the app itself ---------- */
function appHome(bottom, standalone, banner) {
  ctx.fillStyle = '#f6f3ff'; ctx.fillRect(0, -200, 393, SHP + 400);
  rr(0, -230, 393, 490, 26); ctx.fillStyle = grad(0, 0, 393, 260, BRAND); ctx.fill();
  ctx.fillStyle = 'rgba(253,224,71,.35)'; ctx.beginPath(); ctx.arc(350, 30, 80, 0, 7); ctx.fill();
  drawIcon(18, 58, 46, false);
  txt('Prism Scan', 76, 72, 24, '#fff', 800);
  txt('Scan · Enhance · Share', 77, 96, 12, 'rgba(255,255,255,.9)', 600);
  ['Documents', 'Pages', 'Storage'].forEach((l, i) => {
    const x = 18 + i * 122;
    rr(x, 128, 112, 66, 14); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill();
    txt(i === 2 ? '0 KB' : '0', x + 12, 152, 20, '#fff', 800); txt(l, x + 12, 178, 11, 'rgba(255,255,255,.9)', 600);
  });
  let off = 0;
  if (banner) {
    rr(14, 272, 365, 46, 14); ctx.fillStyle = grad(14, 0, 379, 0, ['#dcfce7', '#cffafe']); ctx.fill();
    txt('📲 Install Prism Scan as an app', 26, 295, 13, '#134e4a', 600, 'left', `${FONT}, ${EMOJI}`);
    rr(262, 280, 76, 30, 15); ctx.fillStyle = grad(262, 280, 338, 310, ['#14b8a6', '#0ea5e9']); ctx.fill();
    if (banner > 1) { rr(258, 276, 84, 38, 19); ctx.strokeStyle = `rgba(236,72,153,${banner - 1})`; ctx.lineWidth = 3; ctx.stroke(); }
    txt('Install', 300, 295, 13, '#fff', 800, 'center');
    txt('✕', 360, 295, 13, '#134e4a', 700, 'center');
    off = 98;
  }
  rr(16, 230 + off, 361, 44, 14); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#e7e1f7'; ctx.lineWidth = 2; ctx.stroke();
  txt('🔍  Search documents', 30, 252 + off, 15, '#9b92b8', 500, 'left', `${FONT}, ${EMOJI}`);
  emoji('📄✨', 196, 420 + off / 2, 40);
  txt('No scans yet', 196, 472 + off / 2, 21, '#db2777', 800, 'center');
  txt('Tap the big camera button to scan', 196, 500 + off / 2, 13, '#6d6488', 500, 'center');
  const dy = bottom - 84;
  rr(16, dy, 361, 70, 24); ctx.fillStyle = '#fff'; ctx.fill();
  miniIcon(70, dy + 35, '🖼️', ['#fbcfe8', '#f9a8d4']); txt('Photos', 70, dy + 60, 10, '#6d6488', 700, 'center');
  miniIcon(323, dy + 35, '💡', ['#99f6e4', '#67e8f9']); txt('Tips', 323, dy + 60, 10, '#6d6488', 700, 'center');
  ctx.beginPath(); ctx.arc(196.5, dy + 6, 36, 0, 7); ctx.fillStyle = '#f6f3ff'; ctx.fill();
  ctx.beginPath(); ctx.arc(196.5, dy + 6, 31, 0, 7); ctx.fillStyle = grad(165, dy - 25, 228, dy + 37, BRAND); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(196.5, dy + 6, 9, 0, 7); ctx.stroke();
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(196.5 + sx * 15, dy + 6 + sy * 8); ctx.lineTo(196.5 + sx * 15, dy + 6 + sy * 15); ctx.lineTo(196.5 + sx * 8, dy + 6 + sy * 15); ctx.stroke();
  });
  if (standalone) statusBar('#fff');
}
function miniIcon(cx, cy, e, cols) { rr(cx - 17, cy - 22, 34, 34, 11); ctx.fillStyle = grad(cx, cy - 22, cx, cy + 12, cols); ctx.fill(); emoji(e, cx, cy - 4, 17); }
function keyboard(goBlue) {
  ctx.fillStyle = OS === 'android' ? '#e8eaed' : '#d1d3d9'; ctx.fillRect(0, SHP - 300, 393, 300);
  ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach((r, ri) => [...r].forEach((k, ki) => {
    const kw = 33, gap = 6, off = (393 - (r.length * kw + (r.length - 1) * gap)) / 2;
    const x = off + ki * (kw + gap), y = SHP - 288 + ri * 54;
    rr(x, y, kw, 44, OS === 'android' ? 10 : 6); ctx.fillStyle = '#fff'; ctx.fill(); txt(k, x + kw / 2, y + 22, 19, '#111', 400, 'center');
  }));
  rr(98, SHP - 126, 196, 44, 8); ctx.fillStyle = '#fff'; ctx.fill(); txt('space', 196, SHP - 104, 15, '#111', 400, 'center');
  rr(302, SHP - 126, 80, 44, 8); ctx.fillStyle = OS === 'android' ? '#1a73e8' : '#0a84ff'; ctx.fill();
  txt(OS === 'android' ? '→' : 'go', 342, SHP - 104, 17, '#fff', 700, 'center');
}

/* ---------- iPhone Safari ---------- */
function safariBar(urlText, menuGlow) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 16;
  ctx.fillStyle = 'rgba(255,255,255,.96)';
  ctx.beginPath(); ctx.arc(40, SHP - 56, 23, 0, 7); ctx.fill();
  rr(72, SHP - 79, 250, 46, 23); ctx.fill();
  ctx.beginPath(); ctx.arc(354, SHP - 56, 23, 0, 7); ctx.fill();
  ctx.restore();
  txt('‹', 39, SHP - 59, 30, '#111', 400, 'center');
  txt(urlText, 197, SHP - 56, 14, '#111', 500, 'center');
  txt('•••', 354, SHP - 58, 16, '#111', 800, 'center');
  if (menuGlow) { ctx.beginPath(); ctx.arc(354, SHP - 56, 27, 0, 7); ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3; ctx.stroke(); }
}
function safariStart(typed, t) {
  ctx.fillStyle = '#f2f2f7'; ctx.fillRect(0, 0, 393, SHP);
  statusBar('#111');
  txt('Favorites', 22, 110, 22, '#111', 800);
  const favs = [['🔎', '#e0e7ff'], ['📰', '#fde68a'], ['🎬', '#fecaca'], ['🛍️', '#bbf7d0'], ['📚', '#bae6fd'], ['🌐', '#e9d5ff'], ['🍳', '#fed7aa'], ['✈️', '#cffafe']];
  favs.forEach(([e, c], i) => { const x = 26 + (i % 4) * 90, y = 140 + Math.floor(i / 4) * 96; rr(x, y, 64, 64, 15); ctx.fillStyle = c; ctx.fill(); emoji(e, x + 32, y + 34, 28); });
  keyboard();
  ctx.fillStyle = '#f2f2f7'; ctx.fillRect(0, SHP - 360, 393, 60);
  rr(14, SHP - 354, 365, 46, 23); ctx.fillStyle = '#fff'; ctx.fill();
  txt(typed, 34, SHP - 331, 15, '#111', 500);
  ctx.font = `500 15px ${FONT}`; const w = ctx.measureText(typed).width;
  if (Math.floor(t * 3) % 2 === 0) { ctx.fillStyle = '#0a84ff'; ctx.fillRect(36 + w, SHP - 343, 2, 22); }
}
function safariLoaded(prog, menuGlow) {
  appHome(SHP - 92, false);
  statusBar('#fff');
  ctx.fillStyle = 'rgba(246,243,255,.9)'; ctx.fillRect(0, SHP - 96, 393, 96);
  safariBar('razinraziq13.github.io', menuGlow);
  if (prog < 1) { ctx.fillStyle = '#0a84ff'; ctx.fillRect(72, SHP - 36, 250 * prog, 3); }
}
function menuPanel(p, hi) {
  if (p <= 0) return;
  const s = easeOut(p);

/* iPhone install steps */

    rr(150, y + 55, 140, 140, 36); ctx.fillStyle = grad(150, y + 55, 290, y + 195, [['#a78bfa', '#ec4899'], ['#38bdf8', '#14b8a6'], ['#fbbf24', '#f97316']][i]); ctx.fill();
    emoji(e, 220, y + 128, 70);

}

const SCENE_SETS = {
  ios: [
    { d: 4.2, draw: intro },
    { d: 6.4, title: 'Open Safari', sub: 'Type the app link, then tap go', draw: i1 },
    { d: 3.6, title: 'Tap  •••  then Share', sub: 'Older iPhones: tap the Share button ⬆', draw: i2 },

  android: [

    { d: 3.6, title: 'Tap Install', sub: 'No green bar? Tap  ⋮  then Install app', draw: a2 },
    { d: 3.6, title: 'Tap Install again', sub: 'Chrome adds it like a normal app', draw: a3 },
    { d: 4.2, title: 'It’s now an app!', sub: 'Tap the new icon on your home screen', draw: a4 },

    { d: 5.2, draw: outro },
  ],
};
let SCENES, TOTAL, STEPS;
function setOS(os) {
  OS = os;
  SCENES = SCENE_SETS[os];
  let n = 0; SCENES.forEach((s, i) => { if (i > 0 && i < SCENES.length - 1) s.step = ++n; });
  STEPS = n; TOTAL = SCENES.reduce((s, x) => s + x.d, 0);
  document.getElementById('os-ios').classList.toggle('on', os === 'ios');
  document.getElementById('os-android').classList.toggle('on', os === 'android');
  const dl = document.getElementById('dl');
  dl.href = os === 'android' ? 'tutorial-android.mp4' : 'tutorial.mp4';
  dl.download = os === 'android' ? 'Prism-Scan-Android-tutorial.mp4' : 'Prism-Scan-iPhone-tutorial.mp4';
  dl.textContent = `⬇ Download ${os === 'android' ? 'Android' : 'iPhone'} video (MP4)`;
  document.getElementById('subline').textContent = `A ${Math.round(TOTAL)}-second guide for ${os === 'android' ? 'Android' : 'iPhone'}`;
}

function render(T) {
  T = Math.max(0, Math.min(TOTAL - 1e-3, T));
  background(T);
  let acc = 0, i = 0;
  while (i < SCENES.length - 1 && T >= acc + SCENES[i].d) acc += SCENES[i++].d;
  const sc = SCENES[i], t = T - acc;
  if (sc.step) { caption(t, sc); phone(() => sc.draw(t)); } else sc.draw(t);
  // dip to dark only where the layout changes (intro -> steps -> outro)
  const fi = 1 - seg(t, 0, .25), fo = seg(t, sc.d - .2, sc.d);
  let f = 0;
  if (i === 0) f = fo;
  else if (i === 1 || i === SCENES.length - 1) f = fi;
  if (i === SCENES.length - 2) f = Math.max(f, fo);
  if (f > 0) { ctx.fillStyle = `rgba(20,10,40,${f * .9})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- player ---------- */
let playing = false, startAt = 0, pos = 0;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function ui() {
  document.getElementById('seek').value = Math.round(pos / TOTAL * 1000);
  document.getElementById('time').textContent = fmt(pos) + ' / ' + fmt(TOTAL);
  document.getElementById('play').textContent = playing ? '❚❚' : '▶';
}
function loop(now) {
  if (!playing) return;
  pos = (now - startAt) / 1000;
  if (pos >= TOTAL) { pos = TOTAL; playing = false; render(pos); ui(); return; }
  render(pos); ui(); requestAnimationFrame(loop);
}
function play() { if (pos >= TOTAL) pos = 0; playing = true; startAt = performance.now() - pos * 1000; requestAnimationFrame(loop); ui(); }
function pause() { playing = false; ui(); }
function switchOS(os) {
  pause(); setOS(os); pos = 0; render(1.6); ui();
  try { history.replaceState(null, '', '?os=' + os); } catch { /* ignore */ }
}
document.getElementById('play').onclick = () => playing ? pause() : play();
cv.onclick = () => playing ? pause() : play();
document.getElementById('restart').onclick = () => { pos = 0; play(); };
document.getElementById('seek').oninput = e => { pos = e.target.value / 1000 * TOTAL; if (playing) startAt = performance.now() - pos * 1000; else render(pos); ui(); };
document.getElementById('os-ios').onclick = () => switchOS('ios');
document.getElementById('os-android').onclick = () => switchOS('android');
icon.onload = iconRound.onload = () => { if (!playing) render(pos || 1.6); };
setOS(OS); render(1.6); ui();

window.__tut = { render, setOS, get TOTAL() { return TOTAL; } };
